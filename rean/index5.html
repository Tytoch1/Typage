<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">4.ជាសុខទី​, ថ្ងៃនេះរៀន tag HTML(onder list)</h1>
    <hr size="5" color="blue" width="60%">
    <hr size="5" color="green" width="70%">
    <hr size="5" color="red" width="80%">
    <ol type="a" start="2">
        <li>color</li>
        <ol type="I" start="4">
            <li>green</li>
            <li>blue</li>
            <li>red</li>
        </ol>
        <li>product</li>
        <ul type="none">
            <li>book</li>
            <li>car</li>
            <li>phone</li>
            <ol start="5">
                <li>bike</li>
                <li>moto</li>
                <li>computer</li>
            </ol>
            <li>pen</li>
        </ul>
        <li>number</li>
    </ol>
</body>
</html>
